services:
  api:
    build: .
    image: gamecollectionapi:repository
    ports:
      - "${API_PORT:-5000}:80"
    environment:
      Repository__Provider: Postgres
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=game_collection;Username=postgres;Password=${POSTGRES_PASSWORD:-local-teaching-password}"
    depends_on:
      - db
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: game_collection
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-local-teaching-password}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data:
