services:
  api:
    build: .
    image: gamecollectionapi:api-key
    ports:
      - "${API_PORT:-5000}:80"
    environment:
      Repository__Provider: Postgres
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=game_collection;Username=postgres;Password=${POSTGRES_PASSWORD:-local-teaching-password}"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: game_collection
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-local-teaching-password}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d game_collection"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
